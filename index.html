<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fake Wallet</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
            margin:0;
            padding:20px;
        }

        .top{
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .wallet{
            font-size:32px;
            font-weight:bold;
        }

        .card{
            background:#1e293b;
            border-radius:25px;
            padding:25px;
            margin-top:20px;
        }

        .small{
            color:#94a3b8;
            font-size:15px;
        }

        .balance{
            font-size:42px;
            font-weight:bold;
            margin-top:10px;
        }

        .coins{
            margin-top:20px;
        }

        .coin{
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:#111827;
            padding:18px;
            border-radius:18px;
            margin-top:12px;
        }

        .left{
            display:flex;
            align-items:center;
            gap:12px;
        }

        .icon{
            width:42px;
            height:42px;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:20px;
        }

        .ton{
            background:#0098ea;
        }

        .btc{
            background:#f7931a;
        }

        .eth{
            background:#627eea;
        }

        .price{
            color:#94a3b8;
            font-size:14px;
        }

        button{
            width:100%;
            padding:18px;
            border:none;
            border-radius:18px;
            font-size:18px;
            background:#2563eb;
            color:white;
            margin-top:20px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }
    </style>
</head>

<body>

    <div class="top">
        <div class="wallet">💸 Fake Wallet</div>
    </div>

    <div class="card">
        <div class="small">Общий баланс</div>
        <div class="balance">$12,458</div>
    </div>

    <div class="card">

        <h2>Активы</h2>

        <div class="coins">

            <div class="coin">
                <div class="left">
                    <div class="icon ton">💎</div>

                    <div>
                        <div>TON</div>
                        <div class="price">$3.21</div>
                    </div>
                </div>

                <div>125 TON</div>
            </div>

            <div class="coin">
                <div class="left">
                    <div class="icon btc">₿</div>

                    <div>
                        <div>Bitcoin</div>
                        <div class="price">$75,000</div>
                    </div>
                </div>

                <div>0.15 BTC</div>
            </div>

            <div class="coin">
                <div class="left">
                    <div class="icon eth">Ξ</div>

                    <div>
                        <div>Ethereum</div>
                        <div class="price">$2,400</div>
                    </div>
                </div>

                <div>2.4 ETH</div>
            </div>

        </div>

        <button onclick="sendMoney()">
            💸 Отправить
        </button>

    </div>

    <script>

        let tg = window.Telegram.WebApp;

        tg.expand();

        function sendMoney(){
            alert("💸 Перевод отправлен");
        }

    </script>

</body>
</html>
