<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fake Wallet</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

body{
    margin:0;
    background:#0b1020;
    color:white;
    font-family:Arial;
}

.topbar{
    padding:20px;
    font-size:28px;
    font-weight:bold;
}

.card{
    background:#131c31;
    margin:15px;
    padding:20px;
    border-radius:25px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.balance-title{
    color:#9ca3af;
    font-size:14px;
}

.balance{
    font-size:42px;
    margin-top:10px;
    font-weight:bold;
}

.green{
    color:#22c55e;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.btn{
    flex:1;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#2563eb;
    color:white;
    font-size:16px;
}

.coins{
    margin-top:10px;
}

.coin{
    background:#111827;
    border-radius:20px;
    padding:15px;
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.left{
    display:flex;
    align-items:center;
    gap:15px;
}

.icon{
    width:45px;
    height:45px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
}

.ton{
    background:#0098ea;
}

.btc{
    background:#f7931a;
}

.eth{
    background:#627eea;
}

.usdt{
    background:#26a17b;
}

.price{
    color:#9ca3af;
    font-size:14px;
}

.history{
    margin-top:20px;
}

.tx{
    background:#111827;
    padding:15px;
    border-radius:15px;
    margin-top:10px;
}

.bottom{
    position:fixed;
    bottom:0;
    width:100%;
    background:#111827;
    display:flex;
    justify-content:space-around;
    padding:15px 0;
}

.nav{
    text-align:center;
    color:#9ca3af;
    font-size:14px;
}

.active{
    color:white;
}

</style>
</head>

<body>

<div class="topbar">
💎 Fake Wallet
</div>

<div class="card">

<div class="balance-title">
Total Balance
</div>

<div class="balance">
$12,458
</div>

<div class="green">
+12.4% today
</div>

<div class="buttons">
<button class="btn" onclick="sendMoney()">💸 Send</button>
<button class="btn" onclick="receiveMoney()">📥 Receive</button>
<button class="btn" onclick="swapCoin()">🔄 Swap</button>
</div>

</div>

<div class="card">

<h2>Assets</h2>

<div class="coins">

<div class="coin">
<div class="left">
<div class="icon ton">💎</div>

<div>
<div>TON</div>
<div class="price">$3.21</div>
</div>
</div>

<div>
125 TON
</div>
</div>

<div class="coin">
<div class="left">
<div class="icon btc">₿</div>

<div>
<div>Bitcoin</div>
<div class="price">$75,000</div>
</div>
</div>

<div>
0.15 BTC
</div>
</div>

<div class="coin">
<div class="left">
<div class="icon eth">Ξ</div>

<div>
<div>Ethereum</div>
<div class="price">$2,400</div>
</div>
</div>

<div>
2.4 ETH
</div>
</div>

<div class="coin">
<div class="left">
<div class="icon usdt">$</div>

<div>
<div>USDT</div>
<div class="price">$1.00</div>
</div>
</div>

<div>
4,200 USDT
</div>
</div>

</div>

</div>

<div class="card history">

<h2>Transactions</h2>

<div class="tx">
✅ Received 12 TON
</div>

<div class="tx">
💸 Sent 0.02 BTC
</div>

<div class="tx">
🔄 Swapped ETH → TON
</div>

<div class="tx">
📥 Received 500 USDT
</div>

</div>

<div style="height:100px"></div>

<div class="bottom">

<div class="nav active">
🏠<br>Home
</div>

<div class="nav">
📈<br>Market
</div>

<div class="nav">
💳<br>Cards
</div>

<div class="nav">
⚙️<br>Settings
</div>

</div>

<script>

let tg = window.Telegram.WebApp;
tg.expand();

function sendMoney(){
    alert("💸 Transfer sent");
}

function receiveMoney(){
    alert("📥 Wallet address copied");
}

function swapCoin(){
    alert("🔄 Swap completed");
}

</script>

</body>
</html>
