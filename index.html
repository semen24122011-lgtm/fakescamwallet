<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fake Wallet</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050816;
    color:white;
    font-family:Arial;
    overflow-x:hidden;
}

.top{
    padding:20px;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.balance-card{
    background:#0f172a;
    margin-top:20px;
    padding:25px;
    border-radius:25px;
}

.balance-title{
    color:#9ca3af;
    font-size:16px;
}

.balance{
    font-size:52px;
    font-weight:bold;
    margin-top:10px;
}

.green{
    color:#22c55e;
    margin-top:5px;
    font-size:20px;
}

.actions{
    display:flex;
    gap:12px;
    margin-top:25px;
}

.action-btn{
    flex:1;
    background:#2563eb;
    border:none;
    color:white;
    padding:18px;
    border-radius:18px;
    font-size:18px;
    cursor:pointer;
}

.card{
    background:#0f172a;
    margin:20px;
    padding:20px;
    border-radius:25px;
}

.card h2{
    margin-bottom:20px;
}

.coin{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#111827;
    padding:18px;
    border-radius:18px;
    margin-top:12px;
}

.left{
    display:flex;
    align-items:center;
    gap:15px;
}

.icon{
    width:50px;
    height:50px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
}

.ton{
    background:#0ea5e9;
}

.btc{
    background:#f59e0b;
}

.eth{
    background:#6366f1;
}

.usdt{
    background:#14b8a6;
}

.price{
    color:#9ca3af;
    font-size:14px;
}

.bottom{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#0b1220;
    display:flex;
    justify-content:space-around;
    padding:18px;
}

.nav{
    color:#9ca3af;
    text-align:center;
    cursor:pointer;
}

.nav.active{
    color:white;
}

.page{
    padding:20px;
}

.input{
    background:#111827;
    padding:18px;
    border-radius:15px;
    margin-top:15px;
}

.big-btn{
    width:100%;
    background:#2563eb;
    color:white;
    border:none;
    padding:18px;
    border-radius:18px;
    margin-top:20px;
    font-size:18px;
}

</style>
</head>

<body>

<div id="content">

<div class="top">

<div class="logo">

</div>

</div>

<div class="card">

<div class="coin">

<div class="left">

<div class="icon ton">
💎
</div>

<div>
<div>TON</div>

</div>

</div>

<div>
125 TON

</div>

<div class="coin">

₿
</div>

<div>
<div>Bitcoin</div>

</div>

</div>

<div>
0.15 BTC

</div>

<div class="coin">

<div>

<div>

<div class="bottom">

<div class="nav active" onclick="homePage()">

Home
</div>

Market
</div>

<div class="nav" onclick="cardsPage()">

Cards
</div>

<div class="nav" onclick="settingsPage()">
⚙️<br>
Settings
</div>

</div>

</div>

<script>

let tg = window.Telegram.WebApp;
tg.expand();

function sendPage(){

document.getElementById("content").innerHTML = `

</script>

</html>
